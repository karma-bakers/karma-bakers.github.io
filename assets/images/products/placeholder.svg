<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F2"/>
      <stop offset="50%" stop-color="#FBF0DE"/>
      <stop offset="100%" stop-color="#F4E2C7"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B151B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8B151B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="160" fill="url(#goldGlow)"/>

  <!-- Delicate Border Frame -->
  <rect x="20" y="20" width="560" height="410" rx="16" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <rect x="28" y="28" width="544" height="394" rx="12" fill="none" stroke="#8B151B" stroke-width="1" opacity="0.3"/>

  <!-- Bakery / Sweet Icon Group -->
  <g transform="translate(300, 175)" filter="url(#shadow)">
    <!-- Plate / Tray Base -->
    <ellipse cx="0" cy="45" rx="75" ry="14" fill="#8B151B" opacity="0.12"/>
    <ellipse cx="0" cy="42" rx="70" ry="12" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>

    <!-- Cloche / Dome -->
    <path d="M -50 36 C -50 -10, 50 -10, 50 36 Z" fill="#8B151B"/>
    <path d="M -44 32 C -44 -4, 44 -4, 44 32 Z" fill="#A31D24"/>
    <!-- Dome handle -->
    <circle cx="0" cy="-18" r="8" fill="#D4AF37"/>
    <rect x="-3" y="-12" width="6" height="8" rx="2" fill="#D4AF37"/>

    <!-- Steam swirls -->
    <path d="M -15 -28 Q -10 -40 -18 -52" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 0 -30 Q 8 -42 0 -56" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 15 -28 Q 20 -40 12 -52" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- Wheat stalks left & right -->
    <g transform="translate(-85, 20) rotate(-25)">
      <path d="M 0 0 C 0 -25 10 -40 15 -50" stroke="#D4AF37" stroke-width="2" fill="none"/>
      <ellipse cx="5" cy="-15" rx="3.5" ry="7" fill="#D4AF37" transform="rotate(30 5 -15)"/>
      <ellipse cx="-1" cy="-28" rx="3.5" ry="7" fill="#D4AF37" transform="rotate(-30 -1 -28)"/>
      <ellipse cx="8" cy="-40" rx="3.5" ry="7" fill="#D4AF37" transform="rotate(30 8 -40)"/>
    </g>
    <g transform="translate(85, 20) scale(-1, 1) rotate(-25)">
      <path d="M 0 0 C 0 -25 10 -40 15 -50" stroke="#D4AF37" stroke-width="2" fill="none"/>
      <ellipse cx="5" cy="-15" rx="3.5" ry="7" fill="#D4AF37" transform="rotate(30 5 -15)"/>
      <ellipse cx="-1" cy="-28" rx="3.5" ry="7" fill="#D4AF37" transform="rotate(-30 -1 -28)"/>
      <ellipse cx="8" cy="-40" rx="3.5" ry="7" fill="#D4AF37" transform="rotate(30 8 -40)"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="300" y="295" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#8B151B" text-anchor="middle" letter-spacing="1">
    KARMA WALA SWEETS &amp; BAKERS
  </text>
  <text x="300" y="325" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#C59B27" text-anchor="middle" letter-spacing="3">
    FRESH BAKERY SPECIALTY
  </text>
  <text x="300" y="352" font-family="'Poppins', sans-serif" font-size="12" fill="#6B5E51" text-anchor="middle">
    Freshly Prepared Daily with Premium Ingredients
  </text>

  <!-- Bottom Accent Ribbon -->
  <path d="M 230 375 L 370 375" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="300" cy="375" r="3" fill="#8B151B"/>
</svg>
